services:
  valkey:
    image: valkey/valkey:8
    container_name: pdf-rag-valkey
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: valkey-server --appendonly yes --maxmemory-policy noeviction
    volumes:
      - valkey-data:/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: pdf-rag-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  valkey-data:
  qdrant-data:
